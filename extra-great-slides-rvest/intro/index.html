# Comparação &lt;br&gt;Rvest com &lt;br&gt;BeautifulSoup


---

.pull-left[
No **BeautifulSoup**, nossa configuração inicial é assim: 

```python
# load packages
from bs4 import BeautifulSoup
import requests

# connect to webpage
resp = requests.get("https://bsi.uniriotec.br/")

# get BeautifulSoup object
soup = BeautifulSoup(resp.content)
```
]

--

.pull-right[
Em comparação, no **rvest**:

```r
# load rvest package
library(rvest)
# get HTML object
dados_html &lt;- read_html("https://bsi.uniriotec.br/")
```

]

---
class: inverse, center, middle

# Como procurar por tags HTML específicas

---

.pull-left[
# No BeautifulSoup:

```python
links = soup.find_all("a")
```
]

--

.pull-right[
# No Rvest:

```r
links &lt;- dados_html %&gt;% 
  html_nodes("a")%&gt;% 
  html_attr("href")
```
No **rvest**, usamos o operador **%&gt;%**.
]

---
class: inverse, center, middle

# Como extrair uma lista de todos os objetos

---

.pull-left[
No **BeautifulSoup**, usamos o método **find_all** para extrair uma lista de todos os objetos de uma *tag* específica de uma página da *web*. 

```python
# get all div tags
soup.find_all("div")

# get all h1 tags
soup.find_all("h1")
```
]

--

.pull-right[
No **rvest**, podemos obter tags específicas de HTML usando a função *html_nodes*. 

```r
# scrape all div tags
html_data %&gt;% html_nodes("div")

# scrape header h1 tags
html_data %&gt;% html_nodes("h1")
```
]

# Como raspar dados do site do BSI com o Rvest?


---

### Provavelmente será algo parecido com isso.


```r
link&lt;-"https://bsi.uniriotec.br/bancos-de-dados-i-tin0120/"
pagina &lt;- read_html(link)
r1 &lt;- pagina %&gt;% rvest::html_nodes("h1") %&gt;% html_text()
r4 &lt;- pagina %&gt;% rvest::html_nodes("h4") %&gt;% html_text()
p  &lt;- pagina %&gt;% rvest::html_nodes("p")  %&gt;% html_text()
```
